<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flores amarillas para ti 🌷</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#dce9df;
    font-family:'Cormorant Garamond',serif;
}

/* =========================================
              CANVAS PRINCIPAL
========================================= */

#garden{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    display:block;

    background:
        linear-gradient(
            to bottom,
            #a9c7d4 0%,
            #d9e4d6 42%,
            #718c4c 65%,
            #294b22 100%
        );
}

/* =========================================
              ATMÓSFERA
========================================= */

.atmosphere{
    position:fixed;
    inset:0;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at 50% 42%,
            rgba(255,255,235,.38),
            transparent 35%
        ),
        linear-gradient(
            to bottom,
            rgba(255,255,255,.08),
            transparent 45%,
            rgba(0,30,10,.18)
        );

    z-index:2;
}

/* =========================================
              SOL
========================================= */

.sun{
    position:fixed;

    width:150px;
    height:150px;

    top:9%;
    right:13%;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #fffde4 0%,
            #fff4a8 42%,
            #f6d76a 72%,
            rgba(246,215,106,.1) 100%
        );

    box-shadow:
        0 0 35px rgba(255,239,150,.75),
        0 0 100px rgba(255,228,110,.35);

    opacity:.95;

    z-index:1;
}

/* =========================================
              NUBES
========================================= */

.cloud{
    position:fixed;

    width:260px;
    height:65px;

    border-radius:100px;

    background:rgba(255,255,255,.35);

    filter:blur(10px);

    z-index:1;

    opacity:.55;
}

.cloud::before,
.cloud::after{
    content:"";

    position:absolute;

    background:inherit;

    border-radius:50%;
}

.cloud::before{
    width:110px;
    height:110px;

    left:40px;
    bottom:0;
}

.cloud::after{
    width:85px;
    height:85px;

    right:45px;
    bottom:0;
}

.cloud1{
    top:18%;
    left:-40px;
}

.cloud2{
    top:27%;
    right:-100px;

    transform:scale(.8);
}

.cloud3{
    top:11%;
    left:42%;

    transform:scale(.55);

    opacity:.3;
}

/* =========================================
              MENSAJE
========================================= */

.message{
    position:fixed;

    left:50%;
    bottom:7%;

    width:100%;

    transform:
        translateX(-50%)
        translateY(20px);

    text-align:center;

    z-index:20;

    opacity:0;

    animation:
        messageAppear
        2.5s
        ease-out
        9s
        forwards;

    pointer-events:none;

    text-shadow:
        0 2px 8px rgba(0,0,0,.35),
        0 0 20px rgba(255,255,220,.35);
}

.love{
    display:block;

    font-family:'Great Vibes',cursive;

    font-size:
        clamp(60px,12vw,105px);

    color:#fff9ce;

    line-height:.95;
}

.flowers{
    display:block;

    margin-top:8px;

    font-family:'Cormorant Garamond',serif;

    font-size:
        clamp(24px,5vw,40px);

    letter-spacing:3px;

    color:#fffef0;
}

@keyframes messageAppear{

    from{
        opacity:0;

        transform:
            translateX(-50%)
            translateY(25px);
    }

    to{
        opacity:1;

        transform:
            translateX(-50%)
            translateY(0);
    }
}

/* =========================================
              VIÑETA
========================================= */

.vignette{
    position:fixed;
    inset:0;

    pointer-events:none;

    z-index:10;

    background:
        radial-gradient(
            ellipse at center,
            transparent 40%,
            rgba(0,20,5,.08) 65%,
            rgba(0,15,5,.35) 100%
        );
}

/* =========================================
              MÓVIL
========================================= */

@media(max-width:600px){

    .sun{
        width:95px;
        height:95px;

        top:10%;
        right:8%;
    }

    .message{
        bottom:7%;
    }

    .love{
        font-size:60px;
    }

    .flowers{
        font-size:25px;
        letter-spacing:1.5px;
    }

}

</style>
</head>

<body>

<canvas id="garden"></canvas>

<div class="sun"></div>

<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="cloud cloud3"></div>

<div class="atmosphere"></div>

<div class="vignette"></div>

<div class="message">

    <span class="love">
        Te amo
    </span>

    <span class="flowers">
        Flores amarillas para ti 🌷
    </span>

</div>


<script>

/* =====================================================
        CAMPO INFINITO DE TULIPANES
===================================================== */

const canvas = document.getElementById("garden");
const ctx = canvas.getContext("2d");

let width = 0;
let height = 0;

let tulips = [];

let cameraZ = 0;

let lastTime = performance.now();

let wind = 0;


/* =====================================================
        CONFIGURACIÓN
===================================================== */

const CONFIG = {

    /* cantidad de flores */
    flowers: 850,

    /* velocidad de avance */
    speed: 0.000085,

    /* profundidad del mundo */
    depth: 1,

    /* ancho del campo */
    fieldWidth: 22,

    /* cantidad de pétalos */
    petals: 6

};


/* =====================================================
        REDIMENSIONAR
===================================================== */

function resize(){

    const dpr =
        Math.min(window.devicePixelRatio || 1,2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =====================================================
        CREAR TULIPANES
===================================================== */

function createTulip(){

    return {

        /*
         x = posición horizontal
         y = posición lateral/altura
         z = profundidad
        */

        x:
            (Math.random() - .5)
            * CONFIG.fieldWidth,

        y:
            Math.random() * .8
            + .1,

        z:
            Math.random() * CONFIG.depth,

        size:
            .55 +
            Math.random() * .85,

        sway:
            Math.random() * Math.PI * 2,

        swaySpeed:
            .5 +
            Math.random() * 1.5,

        lean:
            (Math.random() - .5) * .15,

        brightness:
            .75 +
            Math.random() * .3,

        /* pequeñas variaciones de amarillo */
        yellow:
            45 +
            Math.random() * 25

    };

}


/* =====================================================
        GENERAR MUCHÍSIMOS TULIPANES
===================================================== */

for(
    let i = 0;
    i < CONFIG.flowers;
    i++
){

    tulips.push(
        createTulip()
    );

}


/* =====================================================
        PROYECCIÓN 3D
===================================================== */

function project(tulip){

    let z =
        tulip.z -
        cameraZ;

    /*
      Cuando una flor queda detrás,
      reaparece al fondo.
    */

    while(z < 0.02){

        tulip.z += CONFIG.depth;

        z =
            tulip.z -
            cameraZ;
    }

    const perspective =
        1 / z;

    const horizon =
        height * .43;

    const x =
        width / 2 +
        tulip.x *
        perspective *
        width *
        .035;

    const groundY =
        horizon +
        perspective *
        height *
        .30;

    const size =
        tulip.size *
        perspective *
        30;

    return {

        x,
        groundY,
        size,
        z,
        perspective
    };

}


/* =====================================================
        DIBUJAR TALLO
===================================================== */

function drawStem(
    x,
    groundY,
    size,
    sway
){

    const stemHeight =
        size * 4.7;

    const curve =
        Math.sin(
            wind * .0015 +
            sway
        ) * size * .55;

    ctx.beginPath();

    ctx.moveTo(
        x,
        groundY
    );

    ctx.quadraticCurveTo(

        x + curve * .35,
        groundY - stemHeight * .55,

        x + curve,
        groundY - stemHeight

    );

    ctx.lineWidth =
        Math.max(1,size*.12);

    ctx.strokeStyle =
        "#397438";

    ctx.stroke();

}


/* =====================================================
        DIBUJAR HOJAS
===================================================== */

function drawLeaf(
    x,
    y,
    size,
    direction
){

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        direction
    );

    ctx.beginPath();

    ctx.moveTo(0,0);

    ctx.quadraticCurveTo(
        size*.9,
        -size*.35,
        size*1.25,
        -size*.05
    );

    ctx.quadraticCurveTo(
        size*.7,
        size*.05,
        0,
        0
    );

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            size,
            0
        );

    gradient.addColorStop(
        0,
        "#244f28"
    );

    gradient.addColorStop(
        .6,
        "#4e8a3d"
    );

    gradient.addColorStop(
        1,
        "#79a955"
    );

    ctx.fillStyle = gradient;

    ctx.fill();

    ctx.restore();

}


/* =====================================================
        DIBUJAR TULIPÁN
===================================================== */

function drawTulip(
    tulip,
    projection
){

    const {
        x,
        groundY,
        size
    } = projection;

    /*
      Si está demasiado lejos,
      lo hacemos muy pequeño.
    */

    if(size < .5){

        return;
    }

    const sway =
        Math.sin(
            wind *
            .001 *
            tulip.swaySpeed +
            tulip.sway
        );

    const stemX =
        x +
        sway *
        size *
        .08;

    const stemTop =
        groundY -
        size *
        4.7;


    /* TALLO */

    drawStem(
        x,
        groundY,
        size,
        tulip.sway
    );


    /* HOJA IZQUIERDA */

    drawLeaf(
        x -
        size*.05,
        groundY -
        size*1.8,

        size*.95,

        -1.9 +
        sway*.12
    );


    /* HOJA DERECHA */

    drawLeaf(
        x +
        size*.05,
        groundY -
        size*2.3,

        size*.8,

        -.55 +
        sway*.12
    );


    /*
      CABEZA DEL TULIPÁN
    */

    const flowerX =
        stemX;

    const flowerY =
        stemTop;


    const flowerWidth =
        size * 1.65;

    const flowerHeight =
        size * 2.0;


    ctx.save();

    ctx.translate(
        flowerX,
        flowerY
    );

    ctx.rotate(
        tulip.lean +
        sway*.035
    );


    /*
      Resplandor muy suave
      en las flores cercanas
    */

    if(size > 12){

        ctx.shadowColor =
            "rgba(255,220,60,.22)";

        ctx.shadowBlur =
            size*.5;
    }


    /*
      PÉTALO IZQUIERDO
    */

    ctx.beginPath();

    ctx.moveTo(
        0,
        flowerHeight*.35
    );

    ctx.bezierCurveTo(
        -flowerWidth*.9,
        flowerHeight*.05,
        -flowerWidth*.65,
        -flowerHeight*.7,
        -flowerWidth*.15,
        -flowerHeight*.82
    );

    ctx.bezierCurveTo(
        -flowerWidth*.05,
        -flowerHeight*.25,
        flowerWidth*.05,
        flowerHeight*.1,
        0,
        flowerHeight*.35
    );

    const leftGradient =
        ctx.createLinearGradient(
            0,
            -flowerHeight,
            0,
            flowerHeight
        );

    leftGradient.addColorStop(
        0,
        "#fffbd1"
    );

    leftGradient.addColorStop(
        .45,
        "#ffe94c"
    );

    leftGradient.addColorStop(
        1,
        "#dca800"
    );

    ctx.fillStyle =
        leftGradient;

    ctx.fill();


    /*
      PÉTALO CENTRAL
    */

    ctx.beginPath();

    ctx.moveTo(
        0,
        flowerHeight*.4
    );

    ctx.bezierCurveTo(
        -flowerWidth*.35,
        flowerHeight*.05,
        -flowerWidth*.32,
        -flowerHeight*.85,
        0,
        -flowerHeight
    );

    ctx.bezierCurveTo(
        flowerWidth*.32,
        -flowerHeight*.85,
        flowerWidth*.35,
        flowerHeight*.05,
        0,
        flowerHeight*.4
    );

    const centerGradient =
        ctx.createLinearGradient(
            0,
            -flowerHeight,
            0,
            flowerHeight
        );

    centerGradient.addColorStop(
        0,
        "#fffef0"
    );

    centerGradient.addColorStop(
        .35,
        "#fff06b"
    );

    centerGradient.addColorStop(
        .8,
        "#f5c51e"
    );

    centerGradient.addColorStop(
        1,
        "#c88e00"
    );

    ctx.fillStyle =
        centerGradient;

    ctx.fill();


    /*
      PÉTALO DERECHO
    */

    ctx.beginPath();

    ctx.moveTo(
        0,
        flowerHeight*.35
    );

    ctx.bezierCurveTo(
        flowerWidth*.9,
        flowerHeight*.05,
        flowerWidth*.65,
        -flowerHeight*.7,
        flowerWidth*.15,
        -flowerHeight*.82
    );

    ctx.bezierCurveTo(
        flowerWidth*.05,
        -flowerHeight*.25,
        -flowerWidth*.05,
        flowerHeight*.1,
        0,
        flowerHeight*.35
    );

    const rightGradient =
        ctx.createLinearGradient(
            0,
            -flowerHeight,
            0,
            flowerHeight
        );

    rightGradient.addColorStop(
        0,
        "#fffbd0"
    );

    rightGradient.addColorStop(
        .45,
        "#ffea43"
    );

    rightGradient.addColorStop(
        1,
        "#dda700"
    );

    ctx.fillStyle =
        rightGradient;

    ctx.fill();


    /*
      PEQUEÑO DETALLE CENTRAL
    */

    if(size > 10){

        ctx.beginPath();

        ctx.ellipse(
            0,
            flowerHeight*.25,
            size*.15,
            size*.08,
            0,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
            "#d49a05";

        ctx.fill();
    }


    ctx.restore();

}


/* =====================================================
        ORDENAR POR PROFUNDIDAD
===================================================== */

function sortFlowers(){

    tulips.sort(
        (a,b)=>
            (b.z-cameraZ) -
            (a.z-cameraZ)
    );

}


/* =====================================================
        PÉTALOS FLOTANDO
===================================================== */

const floatingPetals = [];

for(
    let i=0;
    i<45;
    i++
){

    floatingPetals.push({

        x:
            Math.random()*width,

        y:
            Math.random()*height,

        speed:
            .15+
            Math.random()*.45,

        size:
            2+
            Math.random()*4,

        angle:
            Math.random()*Math.PI*2,

        drift:
            .2+
            Math.random()*.8

    });

}


function drawFloatingPetals(){

    for(
        const p of floatingPetals
    ){

        p.y += p.speed;

        p.x +=
            Math.sin(
                wind*.001+
                p.angle
            )*
            p.drift;

        if(
            p.y >
            height+20
        ){

            p.y=-20;

            p.x=
                Math.random()*
                width;
        }

        ctx.save();

        ctx.translate(
            p.x,
            p.y
        );

        ctx.rotate(
            p.angle+
            wind*.001
        );

        ctx.beginPath();

        ctx.ellipse(
            0,
            0,
            p.size,
            p.size*1.8,
            0,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
            "rgba(255,231,75,.65)";

        ctx.fill();

        ctx.restore();

    }

}


/* =====================================================
        HORIZONTE
===================================================== */

function drawHorizon(){

    const horizon =
        height*.43;

    /*
      Montañas/árboles lejanos
    */

    ctx.fillStyle =
        "rgba(40,73,42,.42)";

    ctx.beginPath();

    ctx.moveTo(
        0,
        horizon+35
    );

    for(
        let x=0;
        x<=width;
        x+=35
    ){

        const y =
            horizon+
            25+
            Math.sin(x*.012)*12+
            Math.sin(x*.035)*7;

        ctx.lineTo(
            x,
            y
        );

    }

    ctx.lineTo(
        width,
        height
    );

    ctx.lineTo(
        0,
        height
    );

    ctx.closePath();

    ctx.fill();


    /*
      Camino central
    */

    const center =
        width/2;

    const pathTop =
        center;

    const pathBottom =
        width*.95;

    const gradient =
        ctx.createLinearGradient(
            0,
            horizon,
            0,
            height
        );

    gradient.addColorStop(
        0,
        "rgba(202,184,126,.18)"
    );

    gradient.addColorStop(
        1,
        "rgba(173,145,82,.42)"
    );

    ctx.fillStyle =
        gradient;

    ctx.beginPath();

    ctx.moveTo(
        center-12,
        horizon
    );

    ctx.lineTo(
        center+12,
        horizon
    );

    ctx.lineTo(
        center+
        pathBottom/2,
        height
    );

    ctx.lineTo(
        center-
        pathBottom/2,
        height
    );

    ctx.closePath();

    ctx.fill();

}


/* =====================================================
        ANIMACIÓN PRINCIPAL
===================================================== */

function animate(now){

    const delta =
        Math.min(
            now-lastTime,
            40
        );

    lastTime =
        now;

    wind += delta;

    /*
      Avance constante.
    */

    cameraZ +=
        delta *
        CONFIG.speed;


    /*
      Cuando llegamos al final
      reiniciamos la profundidad.
      El ojo no debería notarlo.
    */

    if(
        cameraZ >
        CONFIG.depth
    ){

        cameraZ -=
            CONFIG.depth;
    }


    /* limpiar */

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
      Cielo
    */

    const sky =
        ctx.createLinearGradient(
            0,
            0,
            0,
            height
        );

    sky.addColorStop(
        0,
        "#a7c9d8"
    );

    sky.addColorStop(
        .38,
        "#dce8df"
    );

    sky.addColorStop(
        .55,
        "#91aa68"
    );

    sky.addColorStop(
        1,
        "#24451e"
    );

    ctx.fillStyle =
        sky;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /*
      Horizonte
    */

    drawHorizon();


    /*
      Ordenar las flores.
    */

    sortFlowers();


    /*
      Dibujar tulipanes.
    */

    for(
        const tulip of tulips
    ){

        const projection =
            project(tulip);

        drawTulip(
            tulip,
            projection
        );

    }


    /*
      Pétalos flotando.
    */

    drawFloatingPetals();


    requestAnimationFrame(
        animate
    );

}


/* =====================================================
        INICIAR
===================================================== */

requestAnimationFrame(
    animate
);

</script>

</body>
</html>
