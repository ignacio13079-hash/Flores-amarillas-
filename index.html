<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flores amarillas para ti 🌼</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
        radial-gradient(circle at 50% 48%,rgba(45,85,45,.22),transparent 35%),
        linear-gradient(to bottom,#020806 0%,#06120d 55%,#0b1c12 100%);
    font-family:'Cormorant Garamond',serif;
    color:white;
}


/* =========================
        LUNA
========================= */

.moon{
    position:absolute;
    width:125px;
    height:125px;
    top:8%;
    right:12%;
    border-radius:50%;

    background:
        radial-gradient(circle at 35% 35%,
        #fffef0 0%,
        #fff9c9 45%,
        #f4e9a4 75%,
        #d8cc88 100%);

    box-shadow:
        0 0 30px rgba(255,248,190,.35),
        0 0 80px rgba(255,245,180,.12);

    opacity:0;
    animation:moonAppear 2s ease-out 1s forwards;
}

@keyframes moonAppear{
    from{
        opacity:0;
        transform:scale(.7);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}


/* =========================
        ESTRELLAS
========================= */

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:#fffbd5;
    border-radius:50%;
    box-shadow:0 0 6px #fffbd5;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{
        opacity:.25;
        transform:scale(.7);
    }

    to{
        opacity:1;
        transform:scale(1.4);
    }
}


/* =========================
        SUELO
========================= */

.ground{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:125px;

    background:
        radial-gradient(ellipse at center,
        rgba(40,90,42,.5),
        transparent 65%),
        linear-gradient(to top,
        #020805,
        transparent);

    z-index:1;
}


/* =========================
        RAMO
========================= */

.bouquet{
    position:absolute;
    left:50%;
    bottom:55px;

    width:380px;
    height:540px;

    transform:translateX(-50%);
    z-index:5;
}


/* =========================
        TALLOS
========================= */

.stem{
    position:absolute;
    left:50%;
    bottom:0;

    width:8px;
    height:0;

    border-radius:20px;

    background:
        linear-gradient(to right,
        #102f19,
        #4c8c3d,
        #1d5227);

    transform-origin:bottom;

    animation:growStem 2.5s ease-out 1s forwards;
}

.stem.s1{
    transform:translateX(-50%) rotate(-13deg);
}

.stem.s2{
    transform:translateX(-50%) rotate(-7deg);
}

.stem.s3{
    transform:translateX(-50%) rotate(-3deg);
}

.stem.s4{
    transform:translateX(-50%) rotate(3deg);
}

.stem.s5{
    transform:translateX(-50%) rotate(8deg);
}

.stem.s6{
    transform:translateX(-50%) rotate(14deg);
}

@keyframes growStem{
    from{
        height:0;
    }

    to{
        height:365px;
    }
}


/* =========================
        HOJAS
========================= */

.leaf{
    position:absolute;

    width:115px;
    height:42px;

    background:
        linear-gradient(135deg,
        #12351b,
        #3f7837 55%,
        #6ba451);

    border-radius:100% 0 100% 0;

    opacity:0;

    box-shadow:
        inset 0 0 8px rgba(255,255,255,.08);
}

.leaf1{
    left:45px;
    bottom:155px;
    transform:rotate(-32deg) scale(0);
    animation:leafAppear 1s ease-out 3s forwards;
}

.leaf2{
    right:42px;
    bottom:190px;
    transform:rotate(25deg) scale(0);
    animation:leafAppear 1s ease-out 3.3s forwards;
}

.leaf3{
    left:90px;
    bottom:250px;
    transform:rotate(-20deg) scale(0);
    animation:leafAppear 1s ease-out 3.5s forwards;
}

.leaf4{
    right:80px;
    bottom:275px;
    transform:rotate(22deg) scale(0);
    animation:leafAppear 1s ease-out 3.7s forwards;
}

@keyframes leafAppear{

    from{
        opacity:0;
        transform:scale(0);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}


/* =========================
        LIRIOS
========================= */

.lily{
    position:absolute;

    width:125px;
    height:125px;

    transform:scale(0);

    animation:lilyAppear 1.5s cubic-bezier(.2,1.5,.5,1) forwards;
}


/* posiciones */

.lily1{
    left:22px;
    top:65px;
    transform:rotate(-17deg) scale(0);
    animation-delay:4s;
}

.lily2{
    left:125px;
    top:20px;
    transform:rotate(-5deg) scale(0);
    animation-delay:4.25s;
}

.lily3{
    right:15px;
    top:65px;
    transform:rotate(17deg) scale(0);
    animation-delay:4.5s;
}

.lily4{
    left:65px;
    top:115px;
    transform:rotate(-9deg) scale(0);
    animation-delay:4.75s;
}

.lily5{
    left:155px;
    top:120px;
    transform:rotate(11deg) scale(0);
    animation-delay:5s;
}

.lily6{
    left:128px;
    top:-20px;
    transform:rotate(4deg) scale(0);
    animation-delay:5.25s;
}


@keyframes lilyAppear{

    0%{
        opacity:0;
        transform:scale(0);
    }

    70%{
        opacity:1;
        transform:scale(1.08);
    }

    100%{
        opacity:1;
        transform:scale(1);
    }
}


/* =========================
        PÉTALOS
========================= */

.lily-petal{
    position:absolute;

    left:50%;
    top:50%;

    width:48px;
    height:88px;

    margin-left:-24px;
    margin-top:-88px;

    border-radius:
        65% 65%
        42% 42%;

    transform-origin:50% 100%;

    background:
        linear-gradient(
            to top,
            #e6aa18 0%,
            #f6d75b 20%,
            #fff1ad 48%,
            #fffdf0 78%,
            #ffffff 100%
        );

    box-shadow:
        inset 0 0 9px rgba(255,255,255,.35),
        0 0 8px rgba(255,220,80,.12);
}

.lily-petal:nth-child(1){
    transform:rotate(0deg);
}

.lily-petal:nth-child(2){
    transform:rotate(60deg);
}

.lily-petal:nth-child(3){
    transform:rotate(120deg);
}

.lily-petal:nth-child(4){
    transform:rotate(180deg);
}

.lily-petal:nth-child(5){
    transform:rotate(240deg);
}

.lily-petal:nth-child(6){
    transform:rotate(300deg);
}


/* =========================
        CENTRO
========================= */

.lily-center{
    position:absolute;

    left:50%;
    top:50%;

    width:32px;
    height:32px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(circle,
        #fff4a0 0%,
        #e6ae22 38%,
        #9c6510 75%,
        #5b3508 100%);

    box-shadow:
        0 0 12px rgba(255,205,50,.35);
}


/* =========================
        ESTAMBRES
========================= */

.stamen{
    position:absolute;

    left:50%;
    top:50%;

    width:3px;
    height:38px;

    background:#9a650d;

    transform-origin:bottom center;
    border-radius:5px;
}

.stamen::after{
    content:"";

    position:absolute;

    top:-5px;
    left:-2px;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#dca82a;

    box-shadow:0 0 5px rgba(255,220,70,.5);
}


/* =========================
        PÉTALOS CAYENDO
========================= */

.falling-petal{
    position:absolute;

    width:13px;
    height:25px;

    border-radius:70% 30% 70% 30%;

    background:
        linear-gradient(
            135deg,
            #fffbdc,
            #f7d63e,
            #e5a814
        );

    opacity:0;

    z-index:4;

    animation:
        fallPetal
        linear
        infinite;
}

@keyframes fallPetal{

    0%{
        opacity:0;
        transform:
            translateY(-20px)
            translateX(0)
            rotate(0deg);
    }

    10%{
        opacity:.9;
    }

    90%{
        opacity:.75;
    }

    100%{
        opacity:0;
        transform:
            translateY(110vh)
            translateX(var(--drift))
            rotate(520deg);
    }
}


/* =========================
        MENSAJE
========================= */

.message{
    position:absolute;

    left:50%;
    bottom:4.5%;

    width:100%;

    transform:translateX(-50%);

    text-align:center;

    z-index:10;

    opacity:0;

    animation:
        messageAppear
        2s
        ease-out
        6.5s
        forwards;
}

.message .love{
    display:block;

    font-family:'Great Vibes',cursive;

    font-size:clamp(52px,10vw,82px);

    line-height:1;

    color:#fff4b0;

    text-shadow:
        0 0 10px rgba(255,235,130,.35),
        0 0 25px rgba(255,215,80,.2);
}

.message .flowers{
    display:block;

    margin-top:8px;

    font-family:'Cormorant Garamond',serif;

    font-size:clamp(25px,5vw,38px);

    letter-spacing:2px;

    color:#fffbe4;
}

@keyframes messageAppear{

    from{
        opacity:0;
        transform:translate(-50%,15px);
    }

    to{
        opacity:1;
        transform:translate(-50%,0);
    }
}


/* =========================
        RESPONSIVE
========================= */

@media(max-width:600px){

    .moon{
        width:90px;
        height:90px;
        top:7%;
        right:8%;
    }

    .bouquet{
        transform:
            translateX(-50%)
            scale(.78);

        transform-origin:
            bottom center;

        bottom:65px;
    }

    .message{
        bottom:4%;
    }

    .message .love{
        font-size:54px;
    }

    .message .flowers{
        font-size:24px;
    }
}

@media(max-height:700px){

    .bouquet{
        transform:
            translateX(-50%)
            scale(.64);

        bottom:20px;
    }

    .message{
        bottom:2%;
    }
}

</style>
</head>


<body>

<div class="moon"></div>

<div class="ground"></div>


<div class="bouquet">

    <!-- TALLOS -->

    <div class="stem s1"></div>
    <div class="stem s2"></div>
    <div class="stem s3"></div>
    <div class="stem s4"></div>
    <div class="stem s5"></div>
    <div class="stem s6"></div>


    <!-- HOJAS -->

    <div class="leaf leaf1"></div>
    <div class="leaf leaf2"></div>
    <div class="leaf leaf3"></div>
    <div class="leaf leaf4"></div>


    <!-- LIRIO 1 -->

    <div class="lily lily1">

        <div class="lily-petal"></div>
        <div class="lily-petal"></div>
        <div class="lily-petal"></div>
        <div class="lily-petal"></div>
        <div class="lily-petal"></div>
        <div class="lily-petal"></div>

        <div class="lily-center"></div>

        <div class="stamen"></div>
        <div class="stamen"></div>
        <div class="stamen"></div>

    </div>


    <!-- LIRIO 2 -->

    <div class="lily lily2">

        <div class="lily-petal"></div>
        <div class="lily-petal"></div>
        <div class="lily-petal"></div>
        <div class="lily-petal"></div>
        <div class="lily-petal"></div>
        <div class="lily-petal"></div>

        <div class="lily-center"></div>

        <div class="stamen"></div>
        <div class="stamen"></div>
        <div class="stamen"></div>

    </div>


    <!-- LIRIO 3 -->

    <div class="lily lily3">

        <div class="lily-petal"></div>
        <div class="lily-petal"></div>
        <div class="lily-petal"></div>
        <div class="lily-petal"></div>
        <div class="lily-petal"></div>
        <div class="lily-petal"></div>

        <div class="lily-center"></div>

        <div class="stamen"></div>
        <div class="stamen"></div>
        <div class="stamen"></div>

    </div>


    <!-- LIRIO 4 -->

    <div class="lily lily4">

        <div class="lily-petal"></div>
        <div class="lily-petal"></div>
        <div class="lily-petal"></div>
        <div class="lily-petal"></div>
        <div class="lily-petal"></div>
        <div class="lily-petal"></div>

        <div class="lily-center"></div>

        <div class="stamen"></div>
        <div class="stamen"></div>
        <div class="stamen"></div>

    </div>


    <!-- LIRIO 5 -->

    <div class="lily lily5">

        <div class="lily-petal"></div>
        <div class="lily-petal"></div>
        <div class="lily-petal"></div>
        <div class="lily-petal"></div>
        <div class="lily-petal"></div>
        <div class="lily-petal"></div>

        <div class="lily-center"></div>

        <div class="stamen"></div>
        <div class="stamen"></div>
        <div class="stamen"></div>

    </div>


    <!-- LIRIO 6 -->

    <div class="lily lily6">

        <div class="lily-petal"></div>
        <div class="lily-petal"></div>
        <div class="lily-petal"></div>
        <div class="lily-petal"></div>
        <div class="lily-petal"></div>
        <div class="lily-petal"></div>

        <div class="lily-center"></div>

        <div class="stamen"></div>
        <div class="stamen"></div>
        <div class="stamen"></div>

    </div>

</div>


<div class="message">

    <span class="love">
        Te amo
    </span>

    <span class="flowers">
        Flores amarillas para ti 🌼
    </span>

</div>


<script>

/* =========================
        ESTRELLAS
========================= */

for(let i=0;i<45;i++){

    const star =
        document.createElement("div");

    star.className =
        "star";

    star.style.left =
        Math.random()*100+"%";

    star.style.top =
        Math.random()*65+"%";

    star.style.animationDelay =
        Math.random()*3+"s";

    star.style.opacity =
        Math.random();

    document.body.appendChild(
        star
    );
}


/* =========================
        PÉTALOS
========================= */

for(let i=0;i<20;i++){

    const petal =
        document.createElement("div");

    petal.className =
        "falling-petal";

    petal.style.left =
        Math.random()*100+"%";

    petal.style.top =
        (-10-Math.random()*20)+"%";

    petal.style.animationDuration =
        (7+Math.random()*8)+"s";

    petal.style.animationDelay =
        (5+Math.random()*12)+"s";

    petal.style.setProperty(
        "--drift",
        ((Math.random()-.5)*160)+"px"
    );

    document.body.appendChild(
        petal
    );
}

</script>

</body>
</html>
