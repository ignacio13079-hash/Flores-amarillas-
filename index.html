<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores amarillas para ti 🌻</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #050807;
      font-family: Georgia, "Times New Roman", serif;
      color: white;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 50% 75%,
          rgba(36, 72, 38, 0.28),
          transparent 38%
        ),
        linear-gradient(
          to bottom,
          #030505 0%,
          #07100b 65%,
          #0a160d 100%
        );
    }

    /* Luna / resplandor */

    .moon-glow {
      position: absolute;
      width: 180px;
      height: 180px;
      top: 8%;
      right: 10%;
      border-radius: 50%;
      background: rgba(255, 240, 180, 0.035);
      filter: blur(30px);
      animation: moonPulse 5s ease-in-out infinite;
    }

    @keyframes moonPulse {
      0%, 100% {
        opacity: .5;
      }
      50% {
        opacity: .9;
      }
    }

    /* Partículas */

    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #fff4a3;
      box-shadow: 0 0 8px 2px rgba(255, 231, 119, .65);
      opacity: 0;
      animation: floatParticle linear infinite;
    }

    @keyframes floatParticle {
      0% {
        transform: translateY(30px) scale(.5);
        opacity: 0;
      }

      20% {
        opacity: .8;
      }

      80% {
        opacity: .65;
      }

      100% {
        transform: translateY(-180px) scale(1);
        opacity: 0;
      }
    }

    /* Suelo */

    .ground {
      position: absolute;
      left: -10%;
      bottom: -80px;
      width: 120%;
      height: 150px;
      border-radius: 50% 50% 0 0;
      background: #07100a;
      box-shadow: 0 -10px 35px rgba(30, 80, 35, .12);
    }

    /* Flor completa */

    .flower {
      position: absolute;
      left: 50%;
      bottom: 40px;
      width: 250px;
      height: 470px;
      transform: translateX(-50%);
    }

    /* Tallo */

    .stem {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 10px;
      height: 0;
      transform: translateX(-50%);
      border-radius: 10px;
      background: linear-gradient(
        to right,
        #163b20,
        #4c8c3e,
        #244d27
      );
      transform-origin: bottom;
      animation: growStem 3.2s ease-out forwards;
      animation-delay: 1.2s;
    }

    @keyframes growStem {
      from {
        height: 0;
      }

      to {
        height: 350px;
      }
    }

    /* Hojas */

    .leaf {
      position: absolute;
      width: 90px;
      height: 42px;
      background: linear-gradient(
        135deg,
        #234d29,
        #579143
      );
      border-radius: 100% 0 100% 0;
      opacity: 0;
    }

    .leaf::after {
      content: "";
      position: absolute;
      width: 2px;
      height: 75px;
      left: 48%;
      top: -15px;
      background: rgba(142, 190, 103, .55);
      transform: rotate(55deg);
      transform-origin: bottom;
    }

    .leaf-left {
      left: 40px;
      bottom: 155px;
      transform: rotate(-25deg) scale(0);
      animation: leafLeft 1s ease-out forwards;
      animation-delay: 3.3s;
    }

    .leaf-right {
      right: 38px;
      bottom: 220px;
      transform: scale(0) rotate(25deg);
      animation: leafRight 1s ease-out forwards;
      animation-delay: 3.7s;
    }

    @keyframes leafLeft {
      to {
        opacity: 1;
        transform: rotate(-25deg) scale(1);
      }
    }

    @keyframes leafRight {
      to {
        opacity: 1;
        transform: scale(1) rotate(25deg);
      }
    }

    /* Cabeza de la flor */

    .flower-head {
      position: absolute;
      left: 50%;
      bottom: 325px;
      width: 145px;
      height: 145px;
      transform: translateX(-50%) scale(0);
      animation: flowerAppear 1.5s cubic-bezier(.2, 1.5, .5, 1) forwards;
      animation-delay: 4.2s;
    }

    @keyframes flowerAppear {
      0% {
        transform: translateX(-50%) scale(0);
      }

      70% {
        transform: translateX(-50%) scale(1.08);
      }

      100% {
        transform: translateX(-50%) scale(1);
      }
    }

    /* Pétalos */

    .petal {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 52px;
      height: 78px;
      margin-left: -26px;
      margin-top: -39px;
      border-radius: 50% 50% 48% 48%;
      background: linear-gradient(
        145deg,
        #fff16a,
        #ffd21c 65%,
        #e5a900
      );
      transform-origin: 50% 95%;
      box-shadow:
        inset 0 0 8px rgba(255,255,255,.25),
        0 0 8px rgba(255,204,0,.12);
    }

    .petal:nth-child(1)  { transform: rotate(0deg) translateY(-38px) scale(.1); }
    .petal:nth-child(2)  { transform: rotate(30deg) translateY(-38px) scale(.1); }
    .petal:nth-child(3)  { transform: rotate(60deg) translateY(-38px) scale(.1); }
    .petal:nth-child(4)  { transform: rotate(90deg) translateY(-38px) scale(.1); }
    .petal:nth-child(5)  { transform: rotate(120deg) translateY(-38px) scale(.1); }
    .petal:nth-child(6)  { transform: rotate(150deg) translateY(-38px) scale(.1); }
    .petal:nth-child(7)  { transform: rotate(180deg) translateY(-38px) scale(.1); }
    .petal:nth-child(8)  { transform: rotate(210deg) translateY(-38px) scale(.1); }
    .petal:nth-child(9)  { transform: rotate(240deg) translateY(-38px) scale(.1); }
    .petal:nth-child(10) { transform: rotate(270deg) translateY(-38px) scale(.1); }
    .petal:nth-child(11) { transform: rotate(300deg) translateY(-38px) scale(.1); }
    .petal:nth-child(12) { transform: rotate(330deg) translateY(-38px) scale(.1); }

    .flower-head.bloom .petal {
      animation: bloomPetal 1.2s cubic-bezier(.2, 1.4, .4, 1) forwards;
    }

    .flower-head.bloom .petal:nth-child(1)  { animation-delay: .00s; }
    .flower-head.bloom .petal:nth-child(2)  { animation-delay: .06s; }
    .flower-head.bloom .petal:nth-child(3)  { animation-delay: .12s; }
    .flower-head.bloom .petal:nth-child(4)  { animation-delay: .18s; }
    .flower-head.bloom .petal:nth-child(5)  { animation-delay: .24s; }
    .flower-head.bloom .petal:nth-child(6)  { animation-delay: .30s; }
    .flower-head.bloom .petal:nth-child(7)  { animation-delay: .36s; }
    .flower-head.bloom .petal:nth-child(8)  { animation-delay: .42s; }
    .flower-head.bloom .petal:nth-child(9)  { animation-delay: .48s; }
    .flower-head.bloom .petal:nth-child(10) { animation-delay: .54s; }
    .flower-head.bloom .petal:nth-child(11) { animation-delay: .60s; }
    .flower-head.bloom .petal:nth-child(12) { animation-delay: .66s; }

    @keyframes bloomPetal {
      0% {
        transform: rotate(var(--rotation)) translateY(-10px) scale(.1);
      }

      65% {
        transform: rotate(var(--rotation)) translateY(-42px) scale(1.08);
      }

      100% {
        transform: rotate(var(--rotation)) translateY(-38px) scale(1);
      }
    }

    /* Centro */

    .center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 55px;
      height: 55px;
      transform: translate(-50%, -50%) scale(0);
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, #8c631d, #51340e 55%, #281807);
      box-shadow:
        inset 0 0 10px rgba(255, 206, 70, .3),
        0 0 15px rgba(255, 189, 35, .2);
      animation: centerAppear 1s ease-out forwards;
      animation-delay: 5.5s;
    }

    @keyframes centerAppear {
      0% {
        transform: translate(-50%, -50%) scale(0);
      }

      80% {
        transform: translate(-50%, -50%) scale(1.15);
      }

      100% {
        transform: translate(-50%, -50%) scale(1);
      }
    }

    /* Mensaje */

    .message {
      position: absolute;
      left: 50%;
      bottom: 6%;
      width: 90%;
      text-align: center;
      transform: translate(-50%, 20px);
      opacity: 0;
      animation: messageAppear 2s ease forwards;
      animation-delay: 6.5s;
    }

    .message h1 {
      font-size: clamp(28px, 7vw, 52px);
      font-weight: normal;
      letter-spacing: 1px;
      color: #ffe66d;
      text-shadow:
        0 0 10px rgba(255, 214, 60, .25),
        0 0 30px rgba(255, 214, 60, .12);
    }

    @keyframes messageAppear {
      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    /* Pequeño brillo final */

    .final-glow {
      position: absolute;
      left: 50%;
      bottom: 42%;
      width: 180px;
      height: 180px;
      transform: translate(-50%, 50%) scale(0);
      border-radius: 50%;
      background: rgba(255, 218, 80, .07);
      filter: blur(35px);
      animation: finalGlow 3s ease-in-out infinite;
      animation-delay: 7s;
    }

    @keyframes finalGlow {
      0%, 100% {
        transform: translate(-50%, 50%) scale(.7);
        opacity: .2;
      }

      50% {
        transform: translate(-50%, 50%) scale(1.2);
        opacity: .7;
      }
    }

    /* Adaptación a pantallas pequeñas */

    @media (max-width: 500px) {
      .flower {
        transform: translateX(-50%) scale(.85);
        transform-origin: bottom center;
      }

      .message {
        bottom: 5%;
      }

      .ground {
        bottom: -90px;
      }
    }

    @media (max-height: 650px) {
      .flower {
        transform: translateX(-50%) scale(.7);
        transform-origin: bottom center;
        bottom: 20px;
      }

      .message {
        bottom: 3%;
      }
    }
  </style>
</head>

<body>

  <main class="scene">

    <div class="moon-glow"></div>
    <div class="final-glow"></div>

    <div class="particles" id="particles"></div>

    <div class="flower">

      <div class="stem"></div>

      <div class="leaf leaf-left"></div>
      <div class="leaf leaf-right"></div>

      <div class="flower-head" id="flowerHead">

        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>

        <div class="center"></div>

      </div>
    </div>

    <div class="ground"></div>

    <div class="message">
      <h1>Flores amarillas para ti</h1>
    </div>

  </main>

  <script>

    /* Crear pequeñas luces flotantes */

    const particlesContainer =
      document.getElementById("particles");

    for (let i = 0; i < 28; i++) {

      const particle =
        document.createElement("div");

      particle.classList.add("particle");

      particle.style.left =
        Math.random() * 100 + "%";

      particle.style.top =
        (45 + Math.random() * 55) + "%";

      particle.style.animationDuration =
        (4 + Math.random() * 6) + "s";

      particle.style.animationDelay =
        (Math.random() * 7) + "s";

      particle.style.transform =
        `scale(${0.5 + Math.random()})`;

      particlesContainer.appendChild(particle);
    }


    /* Iniciar la floración */

    setTimeout(() => {

      document
        .getElementById("flowerHead")
        .classList.add("bloom");

    }, 4800);

  </script>

</body>
</html>
