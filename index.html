<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flores amarillas para ti 🌻</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap"
    rel="stylesheet"
>

<style>

/* =========================
   CONFIGURACIÓN GENERAL
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#020403;
    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;
    color:white;
}


/* =========================
   ESCENA
========================= */

.scene{

    position:relative;

    width:100%;
    height:100%;

    overflow:hidden;

    background:

        radial-gradient(
            circle at 50% 65%,
            rgba(54,105,50,.22),
            transparent 45%
        ),

        linear-gradient(
            to bottom,
            #020403 0%,
            #061009 60%,
            #0a160d 100%
        );

}


/* =========================
   LUNA
========================= */

.moon{

    position:absolute;

    width:125px;
    height:125px;

    top:8%;
    right:12%;

    border-radius:50%;

    background:

        radial-gradient(
            circle at 35% 35%,
            #fffde8,
            #e8e4bb 65%,
            #aaa77f
        );

    opacity:.72;

    box-shadow:

        0 0 35px
        rgba(255,245,190,.25),

        0 0 100px
        rgba(255,245,190,.12);

}


/* =========================
   ESTRELLAS
========================= */

.stars{

    position:absolute;

    inset:0;

    pointer-events:none;

}

.star{

    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:#fff4a3;

    box-shadow:
        0 0 8px #fff1a0;

    animation:
        twinkle
        3s
        ease-in-out
        infinite;

}

@keyframes twinkle{

    0%,100%{
        opacity:.2;
        transform:scale(.6);
    }

    50%{
        opacity:1;
        transform:scale(1.3);
    }

}


/* =========================
   BRILLO DETRÁS DE LA FLOR
========================= */

.glow{

    position:absolute;

    left:50%;
    bottom:40%;

    width:230px;
    height:230px;

    transform:
        translate(-50%,50%);

    border-radius:50%;

    background:
        rgba(255,215,70,.07);

    filter:blur(40px);

    animation:
        glowPulse
        4s
        ease-in-out
        infinite;

}

@keyframes glowPulse{

    0%,100%{
        opacity:.2;
        scale:.7;
    }

    50%{
        opacity:.8;
        scale:1.15;
    }

}


/* =========================
   SUELO
========================= */

.ground{

    position:absolute;

    left:-10%;
    bottom:-100px;

    width:120%;
    height:170px;

    border-radius:
        50% 50% 0 0;

    background:#061009;

    box-shadow:
        0 -15px 40px
        rgba(40,90,40,.15);

}


/* =========================
   FLOR COMPLETA
========================= */

.flower{

    position:absolute;

    left:50%;
    bottom:70px;

    width:270px;
    height:490px;

    transform:
        translateX(-50%);

}


/* =========================
   TALLO
========================= */

.stem{

    position:absolute;

    left:50%;
    bottom:0;

    width:11px;
    height:0;

    transform:
        translateX(-50%);

    border-radius:20px;

    background:

        linear-gradient(
            to right,
            #12361c,
            #4a8a3e,
            #1c4b25
        );

    transform-origin:
        bottom;

    animation:
        growStem
        3s
        ease-out
        forwards;

}

@keyframes growStem{

    from{
        height:0;
    }

    to{
        height:355px;
    }

}


/* =========================
   HOJAS
========================= */

.leaf{

    position:absolute;

    width:108px;
    height:50px;

    background:

        linear-gradient(
            135deg,
            #183d20,
            #579447
        );

    border-radius:
        100% 0 100% 0;

    opacity:0;

}

.leaf::after{

    content:"";

    position:absolute;

    width:2px;
    height:90px;

    left:50%;
    top:-20px;

    background:
        rgba(170,210,120,.45);

    transform:
        rotate(55deg);

}

.leaf-left{

    left:20px;
    bottom:145px;

    transform:
        rotate(-28deg)
        scale(0);

    animation:
        leafLeft
        1s
        ease-out
        3s
        forwards;

}

.leaf-right{

    right:20px;
    bottom:210px;

    transform:
        rotate(25deg)
        scale(0);

    animation:
        leafRight
        1s
        ease-out
        3.4s
        forwards;

}

@keyframes leafLeft{

    to{

        opacity:1;

        transform:
            rotate(-28deg)
            scale(1);

    }

}

@keyframes leafRight{

    to{

        opacity:1;

        transform:
            rotate(25deg)
            scale(1);

    }

}


/* =========================
   CABEZA DE LA FLOR
   NO SE MODIFICA
========================= */

.flower-head{

    position:absolute;

    left:50%;

    bottom:320px;

    width:190px;
    height:190px;

    transform:
        translateX(-50%)
        scale(0);

    animation:

        flowerAppear
        1.5s
        cubic-bezier(.2,1.5,.5,1)
        3.8s
        forwards;

}

@keyframes flowerAppear{

    0%{

        transform:
            translateX(-50%)
            scale(0);

    }

    70%{

        transform:
            translateX(-50%)
            scale(1.12);

    }

    100%{

        transform:
            translateX(-50%)
            scale(1);

    }

}


/* =========================
   PÉTALOS
   NO SE MODIFICAN
========================= */

.petal{

    position:absolute;

    left:50%;
    top:50%;

    width:52px;
    height:88px;

    margin-left:-26px;
    margin-top:-44px;

    border-radius:
        55% 55% 48% 48%;

    background:

        linear-gradient(
            145deg,
            #fff36a 0%,
            #ffd21f 55%,
            #e9a900 100%
        );

    transform-origin:
        50% 100%;

    box-shadow:

        inset
        0 0 10px
        rgba(255,255,255,.3),

        0 0 10px
        rgba(255,210,30,.18);

}


/* =========================
   12 PÉTALOS
========================= */

.petal:nth-child(1){
    transform:
        rotate(0deg)
        translateY(-57px);
}

.petal:nth-child(2){
    transform:
        rotate(30deg)
        translateY(-57px);
}

.petal:nth-child(3){
    transform:
        rotate(60deg)
        translateY(-57px);
}

.petal:nth-child(4){
    transform:
        rotate(90deg)
        translateY(-57px);
}

.petal:nth-child(5){
    transform:
        rotate(120deg)
        translateY(-57px);
}

.petal:nth-child(6){
    transform:
        rotate(150deg)
        translateY(-57px);
}

.petal:nth-child(7){
    transform:
        rotate(180deg)
        translateY(-57px);
}

.petal:nth-child(8){
    transform:
        rotate(210deg)
        translateY(-57px);
}

.petal:nth-child(9){
    transform:
        rotate(240deg)
        translateY(-57px);
}

.petal:nth-child(10){
    transform:
        rotate(270deg)
        translateY(-57px);
}

.petal:nth-child(11){
    transform:
        rotate(300deg)
        translateY(-57px);
}

.petal:nth-child(12){
    transform:
        rotate(330deg)
        translateY(-57px);
}


/* =========================
   CENTRO DE LA FLOR
   ÚNICO ELEMENTO CORREGIDO
========================= */

.center{

    position:absolute;

    left:50%;

    /*
       El centro se baja 12px.
       Todo lo demás de la flor
       permanece exactamente igual.
    */

    top:calc(50% + 12px);

    width:72px;
    height:72px;

    transform:
        translate(-50%,-50%)
        scale(0);

    border-radius:50%;

    background:

        radial-gradient(
            circle at 30% 30%,
            #9d7121,
            #5b390d 55%,
            #241504
        );

    box-shadow:

        inset
        0 0 15px
        rgba(255,210,70,.25),

        0 0 20px
        rgba(255,180,30,.2);

    animation:

        centerAppear
        1s
        ease-out
        5.2s
        forwards;

}

@keyframes centerAppear{

    0%{

        transform:
            translate(-50%,-50%)
            scale(0);

    }

    80%{

        transform:
            translate(-50%,-50%)
            scale(1.15);

    }

    100%{

        transform:
            translate(-50%,-50%)
            scale(1);

    }

}


/* =========================
   MOVIMIENTO DE LA FLOR
========================= */

.flower-head{

    animation:

        flowerAppear
        1.5s
        cubic-bezier(.2,1.5,.5,1)
        3.8s
        forwards,

        sway
        5s
        ease-in-out
        6s
        infinite;

}

@keyframes sway{

    0%,100%{

        margin-left:0;

        rotate:-1deg;

    }

    50%{

        margin-left:3px;

        rotate:1deg;

    }

}


/* =========================
   PÉTALOS QUE CAEN
========================= */

.falling-petals{

    position:absolute;

    inset:0;

    overflow:hidden;

    pointer-events:none;

    z-index:5;

}

.falling-petal{

    position:absolute;

    top:-40px;

    width:14px;
    height:22px;

    border-radius:
        70% 30% 70% 30%;

    background:

        linear-gradient(
            135deg,
            #fff36b,
            #ffd21f 65%,
            #e9a900
        );

    opacity:0;

    filter:

        drop-shadow(
            0 0 5px
            rgba(255,210,40,.25)
        );

    animation:
        fallingPetal
        linear
        infinite;

}

@keyframes fallingPetal{

    0%{

        transform:
            translate3d(
                0,
                -40px,
                0
            )
            rotate(0deg)
            scale(.7);

        opacity:0;

    }

    10%{

        opacity:.8;

    }

    45%{

        transform:
            translate3d(
                var(--drift),
                45vh,
                0
            )
            rotate(180deg)
            scale(1);

    }

    80%{

        opacity:.65;

    }

    100%{

        transform:
            translate3d(
                calc(var(--drift) * -1),
                110vh,
                0
            )
            rotate(420deg)
            scale(.8);

        opacity:0;

    }

}


/* =========================
   MENSAJE
========================= */

.message{

    position:absolute;

    left:50%;
    bottom:5%;

    width:95%;

    text-align:center;

    opacity:0;

    transform:
        translate(-50%,20px);

    animation:
        messageAppear
        2s
        ease
        6.3s
        forwards;

}

.message .love{

    display:block;

    font-family:
        "Great Vibes",
        cursive;

    font-size:
        clamp(50px,12vw,80px);

    font-weight:400;

    color:#fff1a3;

    line-height:1;

    text-shadow:

        0 0 10px
        rgba(255,220,90,.35),

        0 0 30px
        rgba(255,210,60,.25);

}

.message .flowers{

    display:block;

    margin-top:8px;

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size:
        clamp(24px,6vw,38px);

    font-weight:500;

    letter-spacing:2px;

    color:#ffe66d;

    text-shadow:

        0 0 10px
        rgba(255,214,60,.25),

        0 0 25px
        rgba(255,214,60,.12);

}

@keyframes messageAppear{

    to{

        opacity:1;

        transform:
            translate(-50%,0);

    }

}


/* =========================
   CELULAR
========================= */

@media(max-width:500px){

    .flower{

        transform:
            translateX(-50%)
            scale(.82);

        transform-origin:
            bottom center;

        bottom:65px;

    }

    .moon{

        width:90px;
        height:90px;

        right:8%;
        top:7%;

    }

}

@media(max-height:650px){

    .flower{

        transform:
            translateX(-50%)
            scale(.68);

        bottom:25px;

    }

    .message{

        bottom:2%;

    }

}

</style>

</head>


<body>

<main class="scene">


    <!-- LUNA -->

    <div class="moon"></div>


    <!-- BRILLO -->

    <div class="glow"></div>


    <!-- ESTRELLAS -->

    <div
        class="stars"
        id="stars"
    ></div>


    <!-- PÉTALOS QUE CAEN -->

    <div
        class="falling-petals"
        id="fallingPetals"
    ></div>


    <!-- FLOR -->

    <div class="flower">


        <!-- TALLO -->

        <div class="stem"></div>


        <!-- HOJAS -->

        <div
            class="leaf leaf-left"
        ></div>

        <div
            class="leaf leaf-right"
        ></div>


        <!-- CABEZA -->

        <div class="flower-head">


            <!-- PÉTALOS -->

            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>


            <!-- CENTRO -->

            <div class="center"></div>


        </div>


    </div>


    <!-- SUELO -->

    <div class="ground"></div>


    <!-- MENSAJE -->

    <div class="message">


        <span class="love">
            Te amo
        </span>


        <span class="flowers">
            Flores amarillas para ti 🌻
        </span>


    </div>


</main>


<script>


/* =========================
   CREAR ESTRELLAS
========================= */

const stars =
    document.getElementById("stars");


for(let i = 0; i < 45; i++){

    const star =
        document.createElement("div");


    star.className =
        "star";


    star.style.left =
        Math.random() * 100 + "%";


    star.style.top =
        Math.random() * 70 + "%";


    star.style.animationDelay =
        Math.random() * 4 + "s";


    star.style.animationDuration =
        (2 + Math.random() * 3) + "s";


    stars.appendChild(star);

}


/* =========================
   CREAR PÉTALOS
========================= */

const petalsContainer =
    document.getElementById(
        "fallingPetals"
    );


for(let i = 0; i < 18; i++){

    const petal =
        document.createElement("div");


    petal.className =
        "falling-petal";


    petal.style.left =
        Math.random() * 100 + "%";


    petal.style.setProperty(

        "--drift",

        (Math.random() * 160 - 80)
        + "px"

    );


    petal.style.animationDuration =

        (7 + Math.random() * 7)
        + "s";


    petal.style.animationDelay =

        (6 + Math.random() * 8)
        + "s";


    petal.style.width =

        (10 + Math.random() * 9)
        + "px";


    petal.style.height =

        (16 + Math.random() * 12)
        + "px";


    petalsContainer.appendChild(
        petal
    );

}


</script>


</body>

</html>
