<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flores amarillas para ti 🌷</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

/* =====================================================
   BASE
===================================================== */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#7fa05b;
    font-family:'Cormorant Garamond',serif;
}


/* =====================================================
   CIELO
===================================================== */

.sky{
    position:fixed;
    inset:0;

    background:
        linear-gradient(
            to bottom,
            #8db7ca 0%,
            #b9d3d2 30%,
            #e5e7ca 46%,
            #8ba45e 58%,
            #385c2d 100%
        );

    z-index:0;
}


/* =====================================================
   SOL
===================================================== */

.sun{
    position:absolute;

    width:125px;
    height:125px;

    right:11%;
    top:9%;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #fffde6 0%,
            #fff5a8 48%,
            #f2d56d 72%,
            rgba(242,213,109,0) 100%
        );

    box-shadow:
        0 0 35px rgba(255,239,160,.8),
        0 0 100px rgba(255,225,110,.35);

    z-index:1;
}


/* =====================================================
   NUBES
===================================================== */

.cloud{
    position:absolute;

    width:260px;
    height:55px;

    border-radius:100px;

    background:rgba(255,255,255,.28);

    filter:blur(8px);

    z-index:1;
}

.cloud::before,
.cloud::after{
    content:"";

    position:absolute;

    border-radius:50%;

    background:inherit;
}

.cloud::before{
    width:100px;
    height:100px;

    left:40px;
    bottom:0;
}

.cloud::after{
    width:80px;
    height:80px;

    right:40px;
    bottom:0;
}

.cloud.one{
    left:-60px;
    top:19%;
}

.cloud.two{
    right:-100px;
    top:27%;
    transform:scale(.8);
}

.cloud.three{
    left:35%;
    top:12%;
    transform:scale(.55);
    opacity:.35;
}


/* =====================================================
   CAMPO
===================================================== */

.field{
    position:absolute;

    left:0;
    right:0;
    top:45%;
    bottom:0;

    overflow:hidden;

    z-index:3;

    perspective:700px;

    background:
        linear-gradient(
            to bottom,
            #6e914a,
            #436d31 55%,
            #254b25 100%
        );
}


/* =====================================================
   HORIZONTE
===================================================== */

.horizon{
    position:absolute;

    left:0;
    right:0;

    top:43%;

    height:13%;

    background:
        linear-gradient(
            to bottom,
            rgba(49,81,42,.1),
            rgba(35,69,32,.8)
        );

    z-index:2;
}


/* =====================================================
   MUNDO DE TULIPANES
===================================================== */

.world{
    position:absolute;

    left:50%;
    top:0;

    width:100%;
    height:100%;

    transform:
        translateX(-50%);

    transform-style:preserve-3d;
}


/* =====================================================
   TULIPÁN INDIVIDUAL
===================================================== */

.tulip{
    position:absolute;

    width:70px;
    height:180px;

    transform-origin:
        50% 100%;

    transform-style:preserve-3d;

    pointer-events:none;
}


/* =====================================================
   TALLO
===================================================== */

.stem{
    position:absolute;

    left:50%;
    bottom:0;

    width:7px;
    height:125px;

    transform:
        translateX(-50%);

    border-radius:10px;

    background:
        linear-gradient(
            to right,
            #214d26,
            #579143,
            #285b2d
        );

    box-shadow:
        1px 0 2px rgba(0,0,0,.18);
}


/* =====================================================
   HOJAS
===================================================== */

.leaf{
    position:absolute;

    width:58px;
    height:25px;

    bottom:38px;

    border-radius:
        100% 0 100% 0;

    background:
        linear-gradient(
            135deg,
            #1d4b25,
            #4f8b3b,
            #6c9d4a
        );

    transform-origin:
        0 50%;
}

.leaf.left{
    left:34px;
    transform:rotate(-25deg);
}

.leaf.right{
    left:33px;
    bottom:65px;
    transform:scaleX(-1) rotate(-20deg);
}


/* =====================================================
   FLOR
===================================================== */

.flower{
    position:absolute;

    left:50%;
    top:10px;

    width:78px;
    height:78px;

    transform:
        translateX(-50%);

    filter:
        drop-shadow(
            0 5px 5px rgba(0,0,0,.12)
        );
}


/* =====================================================
   PÉTALOS DEL TULIPÁN
===================================================== */

.flower .petal{
    position:absolute;

    top:8px;

    width:39px;
    height:61px;

    border-radius:
        55% 55% 45% 45%;

    background:
        linear-gradient(
            to bottom,
            #fffde0 0%,
            #fff28a 22%,
            #ffd82d 62%,
            #e6a500 100%
        );

    box-shadow:
        inset 0 0 5px rgba(255,255,255,.45);
}


/* pétalo izquierdo */

.flower .petal:nth-child(1){
    left:2px;

    transform:
        rotate(-20deg);
}


/* pétalo central */

.flower .petal:nth-child(2){
    left:19px;
    top:2px;

    height:67px;

    z-index:3;
}


/* pétalo derecho */

.flower .petal:nth-child(3){
    right:2px;

    transform:
        rotate(20deg);
}


/* =====================================================
   CENTRO DE LA FLOR
===================================================== */

.flower .center{
    position:absolute;

    left:50%;
    top:50%;

    width:18px;
    height:18px;

    transform:
        translate(-50%,-20%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #fff3a0,
            #e1a70a 55%,
            #98620b
        );

    z-index:5;
}


/* =====================================================
   PÉTALOS QUE PASAN CERCA DE LA CÁMARA
===================================================== */

.near-petal{
    position:absolute;

    width:25px;
    height:45px;

    border-radius:
        60% 40% 60% 40%;

    background:
        linear-gradient(
            135deg,
            #fffbd0,
            #ffdf39,
            #d99b00
        );

    opacity:.8;

    pointer-events:none;

    z-index:8;
}


/* =====================================================
   BRISA
===================================================== */

.tulip{
    animation:
        breeze
        3s
        ease-in-out
        infinite
        alternate;
}

@keyframes breeze{

    from{
        margin-left:-2px;
    }

    to{
        margin-left:3px;
    }

}


/* =====================================================
   VIÑETA
===================================================== */

.vignette{
    position:fixed;
    inset:0;

    z-index:15;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 45%,
            rgba(15,35,12,.08) 70%,
            rgba(5,20,8,.35) 100%
        );
}


/* =====================================================
   MENSAJE
===================================================== */

.message{
    position:fixed;

    left:50%;
    bottom:6%;

    width:100%;

    text-align:center;

    transform:
        translate(-50%,30px);

    opacity:0;

    z-index:30;

    pointer-events:none;

    animation:
        appearMessage
        2.5s
        ease-out
        8s
        forwards;

    text-shadow:
        0 3px 10px rgba(0,0,0,.45),
        0 0 25px rgba(255,245,160,.3);
}

.love{
    display:block;

    font-family:
        'Great Vibes',
        cursive;

    font-size:
        clamp(60px,12vw,105px);

    line-height:.95;

    color:#fff8bd;
}

.words{
    display:block;

    margin-top:8px;

    font-family:
        'Cormorant Garamond',
        serif;

    font-size:
        clamp(24px,5vw,40px);

    letter-spacing:2px;

    color:#fffde8;
}

@keyframes appearMessage{

    from{
        opacity:0;

        transform:
            translate(-50%,30px);
    }

    to{
        opacity:1;

        transform:
            translate(-50%,0);
    }
}


/* =====================================================
   MÓVIL
===================================================== */

@media(max-width:600px){

    .sun{
        width:90px;
        height:90px;

        right:7%;
        top:8%;
    }

    .field{
        perspective:500px;
    }

    .message{
        bottom:5%;
    }

    .love{
        font-size:58px;
    }

    .words{
        font-size:24px;
    }

}

</style>
</head>


<body>

<div class="sky"></div>

<div class="sun"></div>

<div class="cloud one"></div>
<div class="cloud two"></div>
<div class="cloud three"></div>

<div class="horizon"></div>

<div class="field">

    <div class="world" id="world"></div>

</div>

<div class="vignette"></div>


<div class="message">

    <span class="love">
        Te amo
    </span>

    <span class="words">
        Flores amarillas para ti 🌷
    </span>

</div>


<script>

/* =====================================================
   CONFIGURACIÓN
===================================================== */

const world =
    document.getElementById("world");

const field =
    document.querySelector(".field");


/*
   MUCHÍSIMOS TULIPANES
*/

const TOTAL =
    window.innerWidth < 600
        ? 260
        : 420;


/*
   Profundidad del mundo.

   Los tulipanes nacen en diferentes
   distancias y se van acercando.
*/

const MAX_Z = 1000;

const SPEED = 0.55;


/* =====================================================
   CREAR TULIPÁN
===================================================== */

function makeTulip(){

    const tulip =
        document.createElement("div");

    tulip.className =
        "tulip";


    /*
       Flor
    */

    const flower =
        document.createElement("div");

    flower.className =
        "flower";


    for(let i=0;i<3;i++){

        const petal =
            document.createElement("div");

        petal.className =
            "petal";

        flower.appendChild(
            petal
        );

    }


    const center =
        document.createElement("div");

    center.className =
        "center";

    flower.appendChild(
        center
    );


    /*
       Tallo
    */

    const stem =
        document.createElement("div");

    stem.className =
        "stem";


    /*
       Hojas
    */

    const leafLeft =
        document.createElement("div");

    leafLeft.className =
        "leaf left";


    const leafRight =
        document.createElement("div");

    leafRight.className =
        "leaf right";


    tulip.appendChild(
        flower
    );

    tulip.appendChild(
        stem
    );

    tulip.appendChild(
        leafLeft
    );

    tulip.appendChild(
        leafRight
    );


    world.appendChild(
        tulip
    );


    /*
       Posición inicial
    */

    tulip.userData = {

        /*
           X:

           -1 = extremo izquierdo
            0 = centro
            1 = extremo derecho
        */

        x:
            (Math.random()-.5)
            * 2.4,

        /*
           Z:

           0 = cámara
           1000 = horizonte
        */

        z:
            Math.random()
            * MAX_Z,

        /*
           Variación de tamaño
        */

        scale:
            .65 +
            Math.random()
            * .65,

        /*
           Pequeña inclinación
        */

        tilt:
            (Math.random()-.5)
            * 10

    };


    return tulip;

}


/* =====================================================
   GENERAR EL CAMPO
===================================================== */

for(
    let i=0;
    i<TOTAL;
    i++
){

    makeTulip();

}


/* =====================================================
   PROYECCIÓN
===================================================== */

function updateTulip(
    tulip
){

    const d =
        tulip.userData;


    /*
       Avanzamos hacia la cámara.
    */

    d.z -= SPEED;


    /*
       Cuando una flor nos pasa,
       la mandamos nuevamente al
       horizonte.

       Esto crea el efecto infinito.
    */

    if(d.z < 1){

        d.z =
            MAX_Z +
            Math.random()*300;

        d.x =
            (Math.random()-.5)
            * 2.4;

        d.scale =
            .65 +
            Math.random()
            * .65;
    }


    /*
       Perspectiva.

       Mientras menor sea Z,
       mayor se vuelve la flor.
    */

    const perspective =
        850 /
        (d.z + 20);


    /*
       Posición horizontal.

       Los tulipanes se abren
       hacia los lados.
    */

    const x =
        window.innerWidth/2 +
        d.x *
        window.innerWidth *
        perspective *
        .55;


    /*
       Horizonte del campo.
    */

    const horizon =
        window.innerHeight *
        .10;


    /*
       Posición vertical.

       Cerca = abajo.
       Lejos = horizonte.
    */

    const y =
        horizon +
        perspective *
        window.innerHeight *
        .78;


    /*
       Tamaño.
    */

    const scale =
        perspective *
        d.scale *
        1.15;


    /*
       Si está muy lejos,
       todavía debe ser visible.
    */

    const opacity =
        Math.min(
            1,
            Math.max(
                .25,
                perspective*2.8
            )
        );


    tulip.style.transform =
        `
        translate3d(
            ${x}px,
            ${y}px,
            0
        )
        rotate(${d.tilt}deg)
        scale(${scale})
        `;


    tulip.style.opacity =
        opacity;


    /*
       Las flores cercanas
       quedan por encima.
    */

    tulip.style.zIndex =
        Math.floor(
            2000-d.z
        );

}


/* =====================================================
   PETALITOS QUE PASAN VOLANDO
===================================================== */

const petals = [];

for(
    let i=0;
    i<30;
    i++
){

    const p =
        document.createElement(
            "div"
        );

    p.className =
        "near-petal";

    field.appendChild(p);

    petals.push({

        element:p,

        x:
            Math.random()
            * window.innerWidth,

        y:
            Math.random()
            * window.innerHeight,

        speed:
            .4+
            Math.random()*.8,

        drift:
            (Math.random()-.5)*1.2,

        rotate:
            Math.random()*360

    });

}


/* =====================================================
   ANIMAR PETALITOS
===================================================== */

function updatePetals(){

    for(
        const p of petals
    ){

        p.y += p.speed;

        p.x += p.drift;

        p.rotate += .8;


        if(
            p.y >
            window.innerHeight
        ){

            p.y=-50;

            p.x=
                Math.random()
                * window.innerWidth;
        }


        p.element.style.transform =
            `
            translate(
                ${p.x}px,
                ${p.y}px
            )
            rotate(${p.rotate}deg)
            `;

    }

}


/* =====================================================
   ANIMACIÓN PRINCIPAL
===================================================== */

function animate(){

    const tulips =
        document.querySelectorAll(
            ".tulip"
        );


    /*
       Actualizamos TODOS los
       tulipanes.
    */

    for(
        const tulip of tulips
    ){

        updateTulip(
            tulip
        );

    }


    updatePetals();


    requestAnimationFrame(
        animate
    );

}


/* =====================================================
   INICIAR
===================================================== */

animate();


/* =====================================================
   AJUSTE AL ROTAR EL CELULAR
===================================================== */

window.addEventListener(
    "resize",
    () => {

        /*
          No hace falta reconstruir
          el campo; simplemente
          dejamos que el navegador
          recalcule las posiciones.
        */

    }
);

</script>

</body>
</html>
